<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepesh Singh | Global Executive Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --sec: #ff0055; --bg: #020202; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'JetBrains Mono', monospace; overflow: hidden; height: 100%; }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: -1; }

        /* UI Layer */
        .interface {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
        }

        .hud-frame {
            border: 1px solid rgba(0, 242, 255, 0.3); padding: 60px; position: relative;
            background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px);
            clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
            width: 80%; max-width: 900px; text-align: center;
        }

        .title { font-family: 'Orbitron', sans-serif; font-size: 4rem; margin: 0; background: linear-gradient(to right, #fff, var(--main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* The Core AI Button */
        .ai-orb {
            width: 120px; height: 120px; border-radius: 50%; margin: 30px auto;
            background: radial-gradient(circle, var(--main) 0%, transparent 70%);
            border: 2px solid var(--main); cursor: pointer; position: relative;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
        }
        .ai-orb:hover { transform: scale(1.1) rotate(180deg); border-color: var(--sec); box-shadow: 0 0 50px var(--sec); }
        .ai-orb.active { animation: glitch 0.2s infinite; background: var(--sec); }

        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-5px, 5px); } 40% { transform: translate(-5px, -5px); } 60% { transform: translate(5px, 5px); } 80% { transform: translate(5px, -5px); } 100% { transform: translate(0); } }

        .terminal-text { font-size: 0.9rem; color: var(--main); margin-top: 20px; min-height: 20px; }
        
        .social-grid { display: flex; gap: 20px; margin-top: 40px; justify-content: center; }
        .link-tag { border: 1px solid var(--main); padding: 10px 25px; text-decoration: none; color: var(--main); font-weight: bold; transition: 0.3s; font-size: 0.8rem; }
        .link-tag:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); }

        /* CEO Level Decoration */
        .corner { position: absolute; width: 40px; height: 40px; border: 4px solid var(--main); }
        .top-l { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-r { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bot-l { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bot-r { bottom: 0; right: 0; border-left: none; border-top: none; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="interface">
    <div class="hud-frame">
        <div class="corner top-l"></div><div class="corner top-r"></div>
        <div class="corner bot-l"></div><div class="corner bot-r"></div>

        <p style="letter-spacing: 5px; font-size: 0.7rem; color: var(--sec); margin-bottom: 10px;">AUTH_LEVEL: CEO_ADMIN // ENCRYPTED_V3</p>
        <h1 class="title">DEEPESH SINGH</h1>
        <p style="opacity: 0.5; font-size: 1.1rem;">BCA ARCHITECT | CCSU | NOIDA REGION</p>

        <div class="ai-orb" id="orb" onclick="initiateDeepu()">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>

        <div class="terminal-text" id="status">COMMAND CENTER: READY. CLICK ORB TO START.</div>

        <div class="social-grid">
            <a href="https://www.linkedin.com/in/deepeshsinghwork" target="_blank" class="link-tag">LINKEDIN_CONNECT</a>
            <a href="https://github.com/TheDeepeshSingh" target="_blank" class="link-tag">GIT_MAINFRAME</a>
            <a href="mailto:deepesh.work26@gmail.com" class="link-tag">DIRECT_MAIL</a>
        </div>
    </div>
</div>

<script>
    // --- 3D GLOBAL NETWORK (THREE.JS) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const particlesGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(5000 * 3);
    for(let i=0; i<5000*3; i++) { posArray[i] = (Math.random() - 0.5) * 10; }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.005, color: '#00f2ff' });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    camera.position.z = 3;

    document.addEventListener('mousemove', (e) => {
        particlesMesh.rotation.y = e.clientX * 0.0001;
        particlesMesh.rotation.x = e.clientY * 0.0001;
    });

    function animate() {
        requestAnimationFrame(animate);
        particlesMesh.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
    animate();

    // --- UNIVERSAL VOICE ENGINE (CHROME/SAFARI/EDGE) ---
    const orb = document.getElementById('orb');
    const status = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        status.innerText = "BROWSER UNSUPPORTED. USE CHROME.";
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    function initiateDeepu() {
        // Voice access permission trigger
        recognition.start();
        orb.classList.add('active');
        status.innerText = ">>> DEEPU_AI: LISTENING FOR ENCRYPTED COMMANDS...";
        
        // CEO level sound feedback (Optional/Silent)
        console.log("Deepu AI Session Started.");
    }

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 0.85; // Deep professional voice
        utterance.rate = 1;
        window.speechSynthesis.speak(utterance);
    }

    recognition.onresult = (e) => {
        const cmd = e.results[0][0].transcript.toLowerCase();
        orb.classList.remove('active');
        status.innerText = `>>> DECRYPTED: "${cmd.toUpperCase()}"`;
        executeCEOCommand(cmd);
    };

    function executeCEOCommand(cmd) {
        if (cmd.includes('magic')) {
            speak("Activating Global Overdrive. Environment color shifted to Magenta-Pulse.");
            particlesMaterial.color.setHex(0xff0055);
            document.querySelector('.hud-frame').style.borderColor = "#ff0055";
        } 
        else if (cmd.includes('hi') || cmd.includes('hello') || cmd.includes('deepu')) {
            speak("Welcome, Deepesh Singh. All systems at CCSU Noida are fully operational. I am Deepu, your advanced AI executive.");
        } 
        else if (cmd.includes('linkedin')) {
            speak("Establishing secure link to your LinkedIn executive profile.");
            window.open('https://www.linkedin.com/in/deepeshsinghwork', '_blank');
        } 
        else if (cmd.includes('github')) {
            speak("Bypassing firewalls to access GitHub repository 'The Deepesh Singh'.");
            window.open('https://github.com/TheDeepeshSingh', '_blank');
        } 
        else if (cmd.includes('email') || cmd.includes('contact')) {
            speak("Drafting communication for deepesh dot work 26 at gmail dot com.");
            window.location.href = "mailto:deepesh.work26@gmail.com";
        }
        else {
            speak("Command processed but not authorized in elite mode.");
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
