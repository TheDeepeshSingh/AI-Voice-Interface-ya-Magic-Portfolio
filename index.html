<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepesh | AI Portfolio</title>
    <style>
        :root { --primary: #00ffcc; --bg: #0a0a0a; --text: #ffffff; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); text-align: center; margin: 0; overflow-x: hidden; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .status-box { border: 1px solid var(--primary); padding: 20px; border-radius: 10px; box-shadow: 0 0 20px var(--primary); margin-bottom: 20px; }
        .mic-btn { background: var(--primary); border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .mic-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--primary); }
        .section { height: 100vh; padding: 50px; border-top: 1px solid #333; }
        #output { color: var(--primary); margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div class="hero" id="home">
        <div class="status-box">
            <h1>SYSTEM: DEEPESH SINGH</h1>
            <p>AI-Powered Portfolio Beta v1.0</p>
            <p id="output">Click the mic and say "Hi Deepesh" or "Show Projects"</p>
        </div>
        <button class="mic-btn" onclick="startListening()">🎤 ACTIVATE VOICE CONTROL</button>
    </div>

    <div class="section" id="about">
        <h2>[ ABOUT ME ]</h2>
        <p>BCA Student @ CCSU | Java & Python Enthusiast</p>
    </div>

    <div class="section" id="projects">
        <h2>[ PROJECTS ]</h2>
        <p>1. Personal Portfolio (Live)<br>2. Voice Controlled Interface (Current)</p>
    </div>

    <script>
        const output = document.getElementById('output');
        
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            output.innerText = "Listening...";

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript.toLowerCase();
                output.innerText = 'You said: "' + command + '"';

                if (command.includes('hi') || command.includes('hello')) {
                    speak("Hello! I am Deepesh's AI assistant. How can I help you?");
                } else if (command.includes('project')) {
                    document.getElementById('projects').scrollIntoView({ behavior: 'smooth' });
                    speak("Navigating to projects section.");
                } else if (command.includes('about')) {
                    document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
                    speak("Here is some information about Deepesh.");
                } else {
                    speak("I heard you, but I only respond to: Hi, Projects, or About.");
                }
            };

            recognition.start();
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
